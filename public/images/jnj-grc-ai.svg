<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950" role="img" aria-label="Johnson &amp; Johnson, enterprise GRC and conversational AI">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fcfcfd"/>
      <stop offset="1" stop-color="#eef0f5"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="faint" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="haze" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1600" height="950" fill="url(#ground)"/>

  <!-- a warm haze under the wordmark so the red reads as part of the image -->
  <g filter="url(#haze)" opacity="0.4">
    <ellipse cx="450" cy="455" rx="330" ry="120" fill="#f2cfc8"/>
  </g>

  <!-- blurred atmosphere: colour lives only in the out-of-focus layer -->
  <g filter="url(#soft)" opacity="0.48">
    <circle cx="1310" cy="220" r="210" fill="#c3cdea"/>
    <circle cx="1470" cy="650" r="165" fill="#d9cfe4"/>
    <circle cx="170" cy="830" r="185" fill="#cfd8ea"/>
    <circle cx="315" cy="150" r="140" fill="#e3d2cf"/>
    <ellipse cx="850" cy="905" rx="250" ry="105" fill="#d5dcec"/>
  </g>

  <!-- blurred panels, as if a dashboard sat just out of focus -->
  <g filter="url(#softer)" opacity="0.5">
    <rect x="980" y="300" width="430" height="120" rx="20" fill="#ffffff"/>
    <rect x="1040" y="470" width="300" height="96" rx="20" fill="#ffffff"/>
    <rect x="120" y="150" width="240" height="88" rx="18" fill="#ffffff"/>
    <rect x="1190" y="110" width="270" height="78" rx="18" fill="#ffffff"/>
    <rect x="55" y="585" width="210" height="74" rx="16" fill="#ffffff"/>
  </g>

  <!-- one crisp element, a thin outline so the frame stays quiet -->
  <g transform="translate(1046 560)" opacity="0.5">
    <rect x="0" y="0" width="330" height="64" rx="32" fill="none" stroke="#8e9ab8" stroke-width="1.5"/>
    <circle cx="298" cy="32" r="15" fill="none" stroke="#8e9ab8" stroke-width="1.5"/>
    <path d="M292 32h11M298 27l5 5-5 5" fill="none" stroke="#8e9ab8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="25" width="180" height="14" rx="7" fill="#8e9ab8" opacity="0.35"/>
  </g>

  <g filter="url(#faint)" opacity="0.38">
    <rect x="1046" y="676" width="220" height="12" rx="6" fill="#98a3bd"/>
    <rect x="1046" y="710" width="150" height="12" rx="6" fill="#98a3bd"/>
    <rect x="132" y="700" width="190" height="11" rx="5.5" fill="#9aa4bc"/>
    <rect x="132" y="732" width="120" height="11" rx="5.5" fill="#9aa4bc"/>
    <circle cx="1418" cy="836" r="26" fill="#aab3c9"/>
  </g>

  <!-- wordmark, sans-serif, in the brand red -->
  <text x="130" y="470"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="76" font-weight="600" letter-spacing="-2" fill="#d51900">Johnson &amp; Johnson</text>
  <text x="134" y="524"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="21" font-weight="500" letter-spacing="5.5" fill="#7b839a">GRC · IAM · CONVERSATIONAL AI</text>
</svg>
