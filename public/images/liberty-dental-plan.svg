<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950" role="img" aria-label="Liberty Dental Plan: healthcare website and e-commerce platform">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f6f3fa"/>
      <stop offset="1" stop-color="#ece5f5"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b2076"/>
      <stop offset="1" stop-color="#8e5ba8"/>
    </linearGradient>
    <pattern id="dots2" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="4" fill="#d6c6e4"/>
    </pattern>
  </defs>

  <rect width="1600" height="950" fill="url(#bg2)"/>
  <circle cx="120" cy="900" r="300" fill="#e4d9ef" opacity="0.6"/>
  <rect x="1336" y="60" width="204" height="170" fill="url(#dots2)" opacity="0.5"/>

  <!-- site / IA mock -->
  <g transform="translate(96 118)">
    <rect width="660" height="440" rx="18" fill="#ffffff" opacity="0.96"/>
    <rect x="0" y="0" width="660" height="56" rx="18" fill="#f4eefa"/>
    <rect x="0" y="40" width="660" height="16" fill="#f4eefa"/>
    <circle cx="34" cy="28" r="8" fill="#c9aede"/><circle cx="60" cy="28" r="8" fill="#e2d4ee"/><circle cx="86" cy="28" r="8" fill="#e2d4ee"/>
    <rect x="34" y="92" width="300" height="22" rx="11" fill="url(#plum)"/>
    <g fill="#ece4f3">
      <rect x="34" y="136" width="420" height="16" rx="8"/>
      <rect x="34" y="170" width="360" height="16" rx="8"/>
    </g>
    <!-- plan cards -->
    <g>
      <rect x="34" y="222" width="182" height="174" rx="12" fill="#f7f2fb" stroke="#e3d5ee"/>
      <rect x="238" y="222" width="182" height="174" rx="12" fill="#f7f2fb" stroke="#e3d5ee"/>
      <rect x="442" y="222" width="182" height="174" rx="12" fill="#ffffff" stroke="#b98fd0" stroke-width="2"/>
      <g fill="#e3d5ee">
        <rect x="58" y="250" width="110" height="14" rx="7"/><rect x="58" y="280" width="78" height="14" rx="7"/>
        <rect x="262" y="250" width="110" height="14" rx="7"/><rect x="262" y="280" width="78" height="14" rx="7"/>
        <rect x="466" y="250" width="110" height="14" rx="7"/><rect x="466" y="280" width="78" height="14" rx="7"/>
      </g>
      <rect x="58" y="342" width="134" height="32" rx="16" fill="#e9dcf2"/>
      <rect x="262" y="342" width="134" height="32" rx="16" fill="#e9dcf2"/>
      <rect x="466" y="342" width="134" height="32" rx="16" fill="url(#plum)"/>
    </g>
  </g>

  <!-- checkout / purchase flow -->
  <g transform="translate(820 200)">
    <rect width="680" height="358" rx="18" fill="#ffffff" opacity="0.97"/>
    <g fill="#5b2076" opacity="0.9">
      <circle cx="76" cy="72" r="16"/>
    </g>
    <circle cx="180" cy="72" r="16" fill="#b98fd0"/>
    <circle cx="284" cy="72" r="16" fill="#e3d5ee"/>
    <path d="M92 72h72M196 72h72" stroke="#e3d5ee" stroke-width="4" stroke-linecap="round"/>
    <g fill="#efe7f5">
      <rect x="60" y="134" width="420" height="18" rx="9"/>
      <rect x="60" y="178" width="340" height="18" rx="9"/>
      <rect x="60" y="222" width="386" height="18" rx="9"/>
    </g>
    <rect x="60" y="272" width="200" height="44" rx="22" fill="url(#plum)"/>
    <g transform="translate(516 128)">
      <circle cx="60" cy="60" r="60" fill="#f4eefa"/>
      <path d="M60 92c-16-12-26-24-26-38a16 16 0 0 1 26-12 16 16 0 0 1 26 12c0 14-10 26-26 38z" fill="#8e5ba8" opacity="0.7"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(96 660)">
    <text font-family="Inter, 'Segoe UI', sans-serif" font-size="70" font-weight="700" letter-spacing="1" fill="#5b2076">LIBERTY DENTAL PLAN</text>
    <text y="60" font-family="Inter, 'Segoe UI', sans-serif" font-size="26" font-weight="600" letter-spacing="4" fill="#6d5f79">HEALTHCARE WEB · IA · E-COMMERCE</text>
  </g>
</svg>
